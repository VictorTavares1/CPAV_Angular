<div class="admin-shell" [class.sidebar-open]="sidebarOpen()">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">

    <div class="sidebar-brand">
      <a class="sidebar-brand-link" routerLink="/admin/dashboard">
        <img src="/images/logo.png" alt="Logo CPAV" class="brand-logo-img" />
        <div class="brand-text">
          <div class="brand-top">CENTRO SOCIAL PAROQUIAL DE</div>
          <div class="brand-name">SÃO LOURENÇO</div>
          <div class="brand-sub">DE ALHOS VEDROS</div>
        </div>
      </a>
    </div>

    <nav class="sidebar-nav">

      <span class="nav-label">Painel</span>
      <a routerLink="/admin/dashboard" routerLinkActive="active"
         [routerLinkActiveOptions]="{exact:true}" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </a>

      <span class="nav-label">Conteúdo</span>
      <a routerLink="/admin/noticias" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7h11a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2h11"/>
          <path d="M8 11h8"/><path d="M8 15h8"/>
        </svg>
        Notícias
      </a>
      <a routerLink="/admin/eventos" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2v3M16 2v3"/><path d="M3 9h18"/>
          <path d="M5 5h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>
        </svg>
        Eventos
      </a>
      <a routerLink="/admin/relatorios" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/>
        </svg>
        Relatórios
      </a>
      <a routerLink="/admin/page-contents" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Páginas
      </a>

      <span class="nav-label">Gestão</span>
      <a routerLink="/admin/contactos" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 11.2a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l.97-.97a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        Contactos
      </a>
      <a routerLink="/admin/servicos" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        Serviços
      </a>

      <span class="nav-label">Sistema</span>
      <a routerLink="/admin/logs" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/><path d="M8 12h8"/><path d="M8 16h6"/>
          <circle cx="17" cy="17" r="3"/><path d="m19 19 1.5 1.5"/>
        </svg>
        Logs
      </a>
      @if (isSuperAdmin) {
        <a routerLink="/admin/utilizadores" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>
          </svg>
          Utilizadores
        </a>
      }

      <span class="nav-label">Conta</span>
      <a routerLink="/admin/conta" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        A Minha Conta
      </a>

      <span class="nav-label">Sessão</span>
      <a href="/" target="_blank" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Ver Site
      </a>
      <button type="button" class="nav-item nav-item--logout" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Terminar Sessão
      </button>

    </nav>

    <!-- Info do utilizador no fundo -->
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <img class="user-avatar" src="/images/logo.png" alt="Logo" />
        <div class="user-info">
          <span class="user-email">{{ userEmail }}</span>
          <span class="user-role">{{ userRoleLabel }}</span>
        </div>
      </div>
    </div>

  </aside>

  <!-- ÁREA PRINCIPAL -->
  <div class="admin-main">

    <!-- Topbar mobile -->
    <header class="admin-topbar">
      <button type="button" class="topbar-toggle" (click)="toggleSidebar()" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-brand">CPAV Admin</span>
    </header>

    <!-- Overlay mobile (visível via CSS quando .sidebar-open) -->
    <div class="sidebar-overlay" (click)="toggleSidebar()"></div>

    <div class="admin-content">
      <router-outlet />
    </div>

  </div>

</div>
